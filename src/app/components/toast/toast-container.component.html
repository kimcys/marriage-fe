<div class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex max-w-md items-start gap-3 rounded-cards px-4 py-3 text-body-sm"
      [class]="classesFor(toast.kind)"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button type="button" class="opacity-80 hover:opacity-100" (click)="toastService.dismiss(toast.id)">✕</button>
    </div>
  }
</div>

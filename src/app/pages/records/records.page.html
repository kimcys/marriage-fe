<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-1">
    <h1 class="m-0 text-heading font-semibold text-ink">All records</h1>
    <p class="m-0 text-body text-mid-gray">Every record extracted so far, across every batch. Search by Bil, IC or name.</p>
  </div>

  <div class="overflow-hidden rounded-cards border border-hairline bg-paper shadow-card">
    <div class="flex flex-wrap items-center gap-2 border-b border-hairline p-5">
      <div class="flex flex-none items-center gap-2">
        <span class="text-subheading font-semibold tracking-tight text-ink">All records</span>
        <span class="rounded-buttons bg-canvas px-2 py-0.5 font-geist-mono text-caption font-medium text-ink-soft">{{ total() }}</span>
      </div>
      <input
        type="text"
        [(ngModel)]="query"
        (ngModelChange)="onQueryChanged()"
        placeholder="Search any field (Bil, IC, name)…"
        class="h-9 min-w-[200px] flex-1 rounded-inputs bg-canvas px-3.5 text-body text-ink"
      />
      <select
        [(ngModel)]="typeFilter"
        (ngModelChange)="onFilterChanged()"
        class="h-9 rounded-buttons bg-canvas px-3.5 text-body font-medium text-ink hover:bg-canvas-hover"
      >
        <option value="ALL">All record types</option>
        <option value="NIKAH">Nikah</option>
        <option value="CERAI">Cerai</option>
        <option value="RUJUK">Rujuk</option>
      </select>
      <select
        [(ngModel)]="statusFilter"
        (ngModelChange)="onFilterChanged()"
        class="h-9 rounded-buttons bg-canvas px-3.5 text-body font-medium text-ink hover:bg-canvas-hover"
      >
        <option value="ALL">All statuses</option>
        <option value="PENDING_REVIEW">Needs review</option>
        <option value="APPROVED">Complete</option>
        <option value="REJECTED">Rejected</option>
      </select>
    </div>

    @if (loading()) {
      <p class="p-5 text-body text-mid-gray">Loading…</p>
    } @else if (records().length === 0) {
      <p class="p-5 text-body text-mid-gray">No records match this filter.</p>
    } @else {
      <app-records-table
        [records]="records()"
        (recordUpdated)="onRecordUpdated($event)"
        (recordDeleted)="onRecordDeleted($event)"
      />

      <div class="flex items-center justify-between gap-3 px-5 py-3">
        <span class="font-geist-mono text-caption text-mid-gray">{{ rangeLabel() }}</span>
        <div class="flex gap-2">
          <button
            type="button"
            class="h-8 rounded-buttons border border-hairline px-3 text-body-sm font-medium text-mid-gray hover:bg-canvas disabled:cursor-not-allowed disabled:opacity-40"
            [disabled]="offset() === 0"
            (click)="previousPage()"
          >
            Previous
          </button>
          <button
            type="button"
            class="h-8 rounded-buttons bg-canvas px-3 text-body-sm font-medium text-ink hover:bg-canvas-hover disabled:cursor-not-allowed disabled:opacity-40"
            [disabled]="!hasNextPage()"
            (click)="nextPage()"
          >
            Next
          </button>
        </div>
      </div>
    }
  </div>
</div>
